version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: rpub

build:
  run_buildscript: false

images:
  - id: rpub
    target: service
    service: rpub
    source: ghcr.io/harshit181/rsspub
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
    application:
      language: zh
      name: Rpub
      source: https://github.com/harshit181/RSSPub
      source_author: harshit181
  private:
    enabled: true
    skip_if_version_exists: true
    name: Rpub
    summary: 由 GitHub Actions 自动发布
