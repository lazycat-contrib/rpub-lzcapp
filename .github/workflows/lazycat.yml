name: Publish LazyCat application

on:
  pull_request:
    paths:
      - .github/lazycat-action.yml
      - .github/workflows/lazycat.yml
      - lzc-build.yml
      - lzc-deploy-params.yml
      - manifest.yml
      - package.yml
  push:
    branches: [main]
    paths:
      - .github/lazycat-action.yml
      - .github/workflows/lazycat.yml
      - icon.png
      - lzc-build.yml
      - lzc-deploy-params.yml
      - manifest.yml
      - package.yml
  schedule:
    - cron: "49 21 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "强制构建的版本（留空则自动检查上游镜像；删除旧版后可填当前版本重新发布）"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      dry-run: ${{ github.event_name == 'pull_request' }}
      versioned-release-asset: true
      version: ${{ inputs.version }}
    secrets:
      LZC_API_HOST: ${{ secrets.LZC_API_HOST }}
      LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
