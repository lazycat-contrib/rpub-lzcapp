params:
  - id: rpub_username
    type: string
    name: "rpub username"
    description: "the rpub username to login"
    default_value: "admin"
    optional: false

  - id: rpub_password
    type: secret
    name: "rpub password"
    description: "the rpub password to login"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    rpub_username:
      name: "rpub用户名"
      description: "rpub 登录的用户名"

    rpub_password:
      name: "rpub密码"
      description: "rpub 登录的密码"
